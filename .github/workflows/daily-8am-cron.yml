name: Cron Job - Daily at 8 AM

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily 8 AM cron job has started!"

      - name: Display Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily cron job completed successfully!"
